[package]
name = "bpaf_unsynn"
version = "0.5.17"
edition = "2018"
categories = ["command-line-interface"]
description = "Derive macros for bpaf Command Line Argument Parser (using unsynn instead of syn)"
keywords = ["args", "arguments", "cli", "parser", "parse"]
authors = ["Michael Baykov <manpacket@gmail.com>", "Luca Barbato <lu_zero@gentoo.org>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pacak/bpaf"

[lib]
name = "bpaf_unsynn"
proc-macro = true

[dependencies]
unsynn = "0.3.0"
proc-macro2 = "1.0.27"
quote = "1.0.9"

[dev-dependencies]
pretty_assertions = "1.3"
bpaf = { path = "..", version = "0.9.20", features = ["autocomplete"] }
trybuild = "1.0"
